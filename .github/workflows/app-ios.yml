name: app-ios

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: app-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-upload:
    # repo 변수 IOS_ENABLED=true 등록 전까지는 skip
    if: vars.IOS_ENABLED == 'true'
    # private 레포에서 비용 부담되면 맥북 runner 등록 후 [self-hosted, macOS] 로 교체
    runs-on: macos-14
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@v7

      - name: tag 와 pubspec 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "tag=$tag pubspec=$ver"
          [[ "$tag" == "$ver" ]] || { echo "::error::태그($tag)와 pubspec version($ver) 불일치"; exit 1; }

      - uses: ./.github/actions/setup-flutter
        with:
          github-token: ${{ github.token }}

      - name: import signing cert
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}

      - name: install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          echo "$PROFILE_BASE64" | base64 --decode > /tmp/flora.mobileprovision
          uuid=$(security cms -D -i /tmp/flora.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/flora.mobileprovision "$dir/$uuid.mobileprovision"

      - name: pod install
        working-directory: app/ios
        run: pod install --repo-update

      - name: build ipa
        working-directory: app
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v7
        with:
          name: ipa-${{ github.run_number }}
          path: app/build/ios/ipa/*.ipa
          retention-days: 14

      - name: upload to testflight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: app/build/ios/ipa/flora.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_P8 }}
