name: app-android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "models.lock"
  workflow_dispatch:

concurrency:
  group: app-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-upload:
    # repo 변수 ANDROID_PACKAGE_NAME 을 등록하기 전까지는 skip
    if: vars.ANDROID_PACKAGE_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-internal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/setup-flutter
        with:
          github-token: ${{ github.token }}

      - name: restore keystore
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          cat > key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - name: build aab
        working-directory: app
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v6
        with:
          name: aab-${{ github.run_number }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: upload to play (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          # 앱이 한 번도 출시 안 된 상태면 draft 만 허용됨. 첫 출시 후 repo 변수로 completed 로 변경
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: cleanup secrets
        if: always()
        working-directory: app/android
        run: rm -f key.properties app/upload-keystore.jks
