name: ml-ci

on:
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check ml
      - run: ruff format --check ml
